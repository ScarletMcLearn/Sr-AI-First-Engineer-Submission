name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the exact Pixi-pinned Python, Node, pnpm and uv from pixi.lock (frozen).
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          locked: true
          cache: true

      - name: Install dependencies from lockfiles
        run: pixi run install-backend && pixi run install-frontend

      - name: Install Playwright Chromium (with system dependencies)
        run: pixi run -- pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Lint (Ruff ALL + ESLint)
        run: pixi run lint

      - name: Formatting (Ruff format + Prettier)
        run: pixi run format-check

      - name: Type checking (mypy strict + tsc)
        run: pixi run typecheck

      # Starts the PostgreSQL service container (docker compose), then pytest (unit, API, concurrency,
      # real-time) with coverage, then the Playwright suite against a freshly started stack.
      - name: Tests
        run: pixi run test

      # Headless, ~10 s: all nine demo scenes with assertions against the isolated l10_e2e stack.
      # Runs after `Tests` (sequential), so nothing else is using that database. Not the 6-minute presentation.
      - name: Validate automated assessment demo
        run: pixi run demo-validate

      - name: Production frontend build
        run: pixi run build

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifacts
          path: |
            backend/coverage.xml
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  docker-smoke:
    name: docker compose up smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the full stack
        run: docker compose up --build --detach --wait

      - name: Health and seed checks
        run: |
          curl --fail --silent http://localhost:8000/api/health
          curl --fail --silent --output /dev/null http://localhost:3000/login
          curl --fail --silent http://localhost:8000/api/users | python3 -c 'import json,sys; assert len(json.load(sys.stdin)) == 9'

      - name: Rules report is valid JSON and matches the committed file
        run: |
          docker compose run --rm -T backend python -m app.cli rules-report 2>/dev/null > /tmp/rules_report.json
          python3 -c 'import json; json.load(open("/tmp/rules_report.json"))'
          diff <(python3 -m json.tool --sort-keys /tmp/rules_report.json) <(python3 -m json.tool --sort-keys rules_report.json)

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
